# Drop-in for pulse.service: /etc/systemd/system/pulse.service.d/hardening.conf
# Kernel, clock and namespace lockdown for the dashboard process. The terminal's
# shell runs through the loopback sshd, outside this sandbox, so sudo there is
# unaffected. Not set on purpose: ProtectProc (the process list reads /proc of
# other users), PrivateDevices (node-pty needs /dev/ptmx), MemoryDenyWriteExecute
# (V8's JIT needs it).
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
UMask=0077
