<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Pulse is offline</title>
    <style>
      :root { --bg: #fff; --card: #f9f9f9; --line: rgba(0,0,0,.1); --text: #0d0d0d; --muted: #424242; --accent: #0d0d0d; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #050505; --card: #0d0d0d; --line: rgba(255,255,255,.1); --text: #f5f5f5; --muted: #b8b8b8; --accent: #f5f5f5; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 380px; padding: 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
      h1 { margin: 0 0 8px; font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 26px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; line-height: 1.5; color: var(--muted); }
      a { display: inline-block; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pulse is offline</h1>
      <p>This device cannot reach your server right now. Check the connection or the VPN, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
